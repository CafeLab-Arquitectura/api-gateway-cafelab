spring:
  application:
    name: api-gateway-cafelab
  cloud:
    gateway:
      server:
        webflux:
          # Timeouts amplios para tolerar cold start de App Service sin Always On
          httpclient:
            connect-timeout: 15000
            response-timeout: 60s

          # Filtro para que no se dupliquen los headers CORS
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
            # Solo reintentar en métodos idempotentes (GET/HEAD) para no duplicar POST/PATCH/DELETE
            - name: Retry
              args:
                retries: 2
                methods: GET,HEAD
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                backoff:
                  firstBackoff: 3s
                  maxBackoff: 15s
                  factor: 2

          # ── Rutas ─────────────────────────────────────────────────────────
          routes:
            # ── IAM service (autenticación y perfiles) ─────────────────────
            # Rutas públicas:  POST /sign-up, POST /sign-in, POST /profiles
            # Rutas protegidas: GET|PATCH /profiles/**
            # JWT de sign-in incluye claim userId (profiles.id); el gateway lo propaga como X-User-Id.
            - id: iam-service
              uri: lb://iam-cafelab
              predicates:
                # /api/v1/profiles (sin trailing slash) necesita su propia entrada
                # /api/v1/profiles/** cubre /{userId} y ?email=...
                - Path=/api/v1/authentication/**,/api/v1/profiles,/api/v1/profiles/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: iam-cb
                    fallbackUri: forward:/fallback/iam

            # ── Eureka Server (acceso para clientes externos) ───────────────
            - id: eureka-server-route
              uri: http://eureka-server:8761
              predicates:
                - Path=/eureka/**

            # ── Procedures service ─────────────────────────────────────────
            # Dominios: recipes, portfolios, cupping-sessions
            # Todos los endpoints requieren JWT (userId / perfil extraídos del token)
            - id: procedures-service
              uri: lb://Procedures-CafeLab
              predicates:
                - Path=/api/v1/recipes,/api/v1/recipes/**,/api/v1/portfolios,/api/v1/portfolios/**,/api/v1/cupping-sessions,/api/v1/cupping-sessions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: procedures-cb
                    fallbackUri: forward:/fallback/procedures

            # ── Defects service (desplegado en Azure) ───────────────────────
            - id: defects-service
              uri: https://defects-cafelab-e6bqarchf5dxd7h0.chilecentral-01.azurewebsites.net
              predicates:
                - Path=/api/v1/defects,/api/v1/defects/**

            # ── Calibrations service ───────────────────────────────────────
            # Dominios: calibrations (calibraciones de molienda y perfiles de preparación)
            # Todos los endpoints requieren JWT
            - id: calibrations-service
              uri: lb://Calibrations-CafeLab
              predicates:
                - Path=/api/v1/calibrations,/api/v1/calibrations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: calibrations-cb
                    fallbackUri: forward:/fallback/calibrations

            # ── Management service ─────────────────────────────────────────
            # Dominios: coffee-lots, suppliers, roast-profiles, inventory-entries
            # Todos los endpoints requieren JWT
            - id: management-service
              uri: lb://Management-CafeLab
              predicates:
                - Path=/api/v1/coffee-lots,/api/v1/coffee-lots/**,/api/v1/suppliers,/api/v1/suppliers/**,/api/v1/roast-profiles,/api/v1/roast-profiles/**,/api/v1/inventory-entries,/api/v1/inventory-entries/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: management-cb
                    fallbackUri: forward:/fallback/management

            # ── IoT Monitoring service ─────────────────────────────────────
            # Dominios: data, histories, dashboard, simulator
            # Todos los endpoints requieren JWT (userId desde token en el backend)
            - id: iot-monitoring-service
              uri: lb://iotmonitoring
              predicates:
                - Path=/api/v1/iot-monitoring,/api/v1/iot-monitoring/**,/api/v1/telemetry-records,/api/v1/telemetry-records/**,/api/v1/environment-thresholds,/api/v1/environment-thresholds/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: iot-monitoring-cb
                    fallbackUri: forward:/fallback/iot-monitoring

            # ── Costing service ────────────────────────────────────────────
            # Dominios: batches, lot-performances (costos, rentabilidad, US11/US14)
            # Todos los endpoints requieren JWT
            - id: costing-service
              uri: lb://costing-cafelab
              predicates:
                - Path=/api/v1/costing,/api/v1/costing/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: costing-cb
                    fallbackUri: forward:/fallback/costing

            # ── Document Autofill service (Python / FastAPI) ───────────────
            # Servicio técnico de apoyo: lee guías de remisión con Document AI y devuelve
            # sugerencias para el formulario de lote. No escribe en Management.
            # No se registra en Eureka: URL fija tomada de DOCUMENT_AUTOFILL_URL (sin lb://).
            # Requiere JWT; el servicio confía en el X-User-Id que inyecta UserContextFilter.
            # Recibe multipart de hasta 10 MB: el gateway no lee el body, lo reenvía en streaming.
            - id: document-autofill-service
              uri: ${DOCUMENT_AUTOFILL_URL:http://localhost:8000}
              predicates:
                - Path=/api/v1/documents/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: document-autofill-cb
                    fallbackUri: forward:/fallback/document-autofill

          # ── CORS global ───────────────────────────────────────────────────
          globalcors:
            corsConfigurations:
              "[/**]":
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

server:
  port: 8080

# Reintentos al resolver userId vía IAM (fallback cuando el JWT no trae userId)
cafelab:
  gateway:
    iam-lookup:
      retries: 4
      initial-backoff: 3s
      max-backoff: 20s
      response-timeout: 60s

# Debe coincidir exactamente con la propiedad del iam-service
authorization:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-0123456789abcdef0123456789abcdef0123456789abcdef}

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# ── Circuit Breaker (Resilience4j) ────────────────────────────────────────────
# El TimeLimiter por defecto de Resilience4j es ~1s; en Azure el IAM puede tardar más.
resilience4j:
  timelimiter:
    configs:
      default:
        timeoutDuration: 120s
        cancelRunningFuture: true
    instances:
      iam-cb:
        timeoutDuration: 120s
  circuitbreaker:
    configs:
      default:
        # Ventana de 20 llamadas; abre el CB si el 60% fallan (más tolerante a cold starts)
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 60
        # 90s en estado OPEN antes de pasar a HALF_OPEN (margen amplio para cold start de Azure)
        waitDurationInOpenState: 90s
        # 5 llamadas de prueba en HALF_OPEN para verificar recuperación
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.gateway.support.NotFoundException
    instances:
      iam-cb:
        base-config: default
      procedures-cb:
        base-config: default
      management-cb:
        base-config: default
      iot-monitoring-cb:
        base-config: default
      costing-cb:
        base-config: default
      document-autofill-cb:
        base-config: default

logging:
  level:
    # Logger dedicado de SecurityAuditFilter (401, 403, 429)
    SECURITY_AUDIT: WARN
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN

spring.cloud.loadbalancer.cache:
  ttl: 5s

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761}/eureka
  instance:
    instance-id: ${WEBSITE_HOSTNAME:localhost}:${spring.application.name}
    prefer-ip-address: false
    hostname: ${WEBSITE_HOSTNAME:localhost}
    secure-port-enabled: false
    secure-port: 443
    non-secure-port-enabled: true
    non-secure-port: 8080
