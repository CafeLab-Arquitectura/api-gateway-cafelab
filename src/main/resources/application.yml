spring:
  application:
    name: api-gateway-cafelab
  cloud:
    gateway:
      server:
        webflux:
          # Timeouts amplios para tolerar cold start de App Service sin Always On
          httpclient:
            connect-timeout: 15000
            response-timeout: 60s

          # Filtro para que no se dupliquen los headers CORS
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
            # Reintenta errores de infraestructura (servicio despertando)
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 3s
                  maxBackoff: 20s
                  factor: 2
            # Reintenta 500 solo en GET (lecturas idempotentes durante cold start)
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR
                methods: GET
                backoff:
                  firstBackoff: 3s
                  maxBackoff: 15s
                  factor: 2

          # ── Rutas ─────────────────────────────────────────────────────────
          routes:

            # ── IAM service (autenticación y perfiles) ─────────────────────
            # Rutas públicas:  POST /sign-up, POST /sign-in, POST /profiles
            # Rutas protegidas: GET|PATCH /profiles/**
            # JWT de sign-in incluye claim userId (profiles.id); el gateway lo propaga como X-User-Id.
            - id: iam-service
              uri: lb://iam-cafelab
              predicates:
                # /api/v1/profiles (sin trailing slash) necesita su propia entrada
                # /api/v1/profiles/** cubre /{userId} y ?email=...
                - Path=/api/v1/authentication/**,/api/v1/profiles,/api/v1/profiles/**

            # ── Procedures service ─────────────────────────────────────────
            # Dominios: recipes, portfolios, defects, cupping-sessions, calibrations
            # Todos los endpoints requieren JWT (userId / perfil extraídos del token)
            - id: procedures-service
              uri: lb://Procedures-CafeLab
              predicates:
                - Path=/api/v1/recipes,/api/v1/recipes/**,/api/v1/portfolios,/api/v1/portfolios/**,/api/v1/defects,/api/v1/defects/**,/api/v1/cupping-sessions,/api/v1/cupping-sessions/**,/api/v1/calibrations,/api/v1/calibrations/**

            # ── Management service ─────────────────────────────────────────
            # Dominios: coffee-lots, suppliers, roast-profiles, inventory-entries
            # Todos los endpoints requieren JWT
            - id: management-service
              uri: lb://Management-CafeLab
              predicates:
                - Path=/api/v1/coffee-lots,/api/v1/coffee-lots/**,/api/v1/suppliers,/api/v1/suppliers/**,/api/v1/roast-profiles,/api/v1/roast-profiles/**,/api/v1/inventory-entries,/api/v1/inventory-entries/**

            # ── IoT Monitoring service ─────────────────────────────────────
            # Dominios: data, histories, dashboard, simulator
            # Todos los endpoints requieren JWT (userId desde token en el backend)
            - id: iot-monitoring-service
              uri: lb://iotmonitoring
              predicates:
                - Path=/api/v1/iot-monitoring,/api/v1/iot-monitoring/**

            # ── Costing service ────────────────────────────────────────────
            # Dominios: batches, lot-performances (costos, rentabilidad, US11/US14)
            # Todos los endpoints requieren JWT
            - id: costing-service
              uri: lb://costing-cafelab
              predicates:
                - Path=/api/v1/costing,/api/v1/costing/**

          # ── CORS global ───────────────────────────────────────────────────
          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOrigins:
                  - "${FRONTEND_URL}"
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600

server:
  port: 8080

# Reintentos al resolver userId vía IAM (fallback cuando el JWT no trae userId)
cafelab:
  gateway:
    iam-lookup:
      retries: 4
      initial-backoff: 3s
      max-backoff: 20s
      response-timeout: 60s

# Debe coincidir exactamente con la propiedad del iam-service
authorization:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761}/eureka
  instance:
    prefer-ip-address: false
    hostname: ${WEBSITE_HOSTNAME:localhost}
